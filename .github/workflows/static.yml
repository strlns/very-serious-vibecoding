# Build AVS//Web and deploy it alongside the repository's other static projects.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js for AVS
        uses: actions/setup-node@v6
        with:
          node-version-file: AVS-Web-Native-Editor-Alpha/.nvmrc
          cache: npm
          cache-dependency-path: AVS-Web-Native-Editor-Alpha/package-lock.json
      - name: Install AVS build dependencies
        working-directory: AVS-Web-Native-Editor-Alpha
        run: npm ci
      - name: Set up Emscripten 4.0.15
        working-directory: AVS-Web-Native-Editor-Alpha
        run: npm run setup:wasm
      - name: Build AVS renderer and production bundle
        working-directory: AVS-Web-Native-Editor-Alpha
        run: npm run build
      - name: Prepare Pages site
        shell: bash
        run: |
          set -euo pipefail
          pages_dir="$RUNNER_TEMP/pages"
          mkdir -p "$pages_dir"
          # Preserve all other tracked projects and the repository index.
          # git archive excludes local caches, node_modules, and build output.
          git archive HEAD | tar -x -C "$pages_dir"
          # Replace the AVS source checkout with Vite's complete production output.
          rm -rf "$pages_dir/AVS-Web-Native-Editor-Alpha"
          cp -R AVS-Web-Native-Editor-Alpha/dist "$pages_dir/AVS-Web-Native-Editor-Alpha"
          test -f "$pages_dir/AVS-Web-Native-Editor-Alpha/renderer-provenance.json"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
